<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gosync Event Test</title>
    <style>
        body { font-family: sans-serif; margin: 20px; background: #f4f4f9; }
        #chat { background: white; border: 1px solid #ddd; height: 300px; overflow-y: scroll; padding: 10px; margin-bottom: 10px; border-radius: 5px; }
        .message { margin-bottom: 8px; padding: 5px; border-bottom: 1px solid #eee; }
        input { padding: 10px; width: 70%; border: 1px solid #ddd; border-radius: 5px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>Gosync Event System</h2>
    <div id="status">Connecting...</div>
    <div id="chat"></div>
    <input type="text" id="messageInput" placeholder="Type a message...">
    <button onclick="sendMessage()">Send</button>

    <script>
        const chat = document.getElementById('chat');
        const input = document.getElementById('messageInput');
        const socket = new WebSocket("ws://localhost:8080/ws");
        const status = document.getElementById('status');

        socket.onopen = () => {
            status.innerText = "Connected to Gosync Server";
            status.style.color = "green";
        };

        socket.onclose = () => {
            status.innerText = "Disconnected from Server";
            status.style.color = "red";
        };

        socket.onmessage = (e) => {
            const event = JSON.parse(e.data);
            if (event.name === "chat") {
                const msgDiv = document.createElement('div');
                msgDiv.className = 'message';
                msgDiv.innerText = "Chat: " + JSON.stringify(event.data);
                chat.appendChild(msgDiv);
                chat.scrollTop = chat.scrollHeight;
            }
        };

        function sendMessage() {
            if (input.value) {
                // IMPORTANT: We now send a JSON object with a 'name' and 'data'
                const event = {
                    name: "chat",
                    data: input.value
                };
                socket.send(JSON.stringify(event));
                input.value = "";
            }
        }
    </script>
</body>
</html>
