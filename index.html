<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gosync MVP Test</title>
    <style>
        body { font-family: sans-serif; margin: 20px; background: #f4f4f9; }
        #chat { background: white; border: 1px solid #ddd; height: 300px; overflow-y: scroll; padding: 10px; margin-bottom: 10px; border-radius: 5px; }
        .message { margin-bottom: 8px; padding: 5px; border-bottom: 1px solid #eee; }
        input { padding: 10px; width: 70%; border: 1px solid #ddd; border-radius: 5px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .status { font-size: 0.8em; color: green; margin-bottom: 10px; }
    </style>
</head>
<body>
    <h2>Gosync Broadcast MVP</h2>
    <div id="status" class="status">Connecting...</div>
    <div id="chat"></div>
    <input type="text" id="messageInput" placeholder="Type a message...">
    <button onclick="sendMessage()">Send</button>

    <script>
        const chat = document.getElementById('chat');
        const status = document.getElementById('status');
        const input = document.getElementById('messageInput');

        // Connect to the Go server
        const socket = new WebSocket("ws://localhost:8080/ws");

        socket.onopen = () => {
            status.innerText = "Connected to Gosync Server";
        };

        socket.onmessage = (event) => {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message';
            msgDiv.innerText = "Broadcast: " + event.data;
            chat.appendChild(msgDiv);
            chat.scrollTop = chat.scrollHeight; // Auto-scroll
        };

        socket.onclose = () => {
            status.innerText = "Disconnected from Server";
            status.style.color = "red";
        };

        function sendMessage() {
            if (input.value) {
                socket.send(input.value);
                input.value = "";
            }
        }

        // Allow pressing Enter to send
        input.addEventListener("keypress", (event) => {
            if (event.key === "Enter") sendMessage();
        });
    </script>
</body>
</html>
