<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gosync Color Sync</title>
    <style>
        body { 
            font-family: sans-serif; 
            margin: 20px; 
            transition: background-color 1s ease; /* Smooth color transition */
        }
        #chat { background: white; border: 1px solid #ddd; height: 200px; overflow-y: scroll; padding: 10px; margin-bottom: 10px; border-radius: 5px; opacity: 0.9; }
        .message { margin-bottom: 8px; padding: 5px; border-bottom: 1px solid #eee; }
        input { padding: 10px; width: 70%; border: 1px solid #ddd; border-radius: 5px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>Gosync: Dynamic Color Sync</h2>
    <div id="status">Connecting...</div>
    <div id="chat"></div>
    <input type="text" id="messageInput" placeholder="Type a message...">
    <button onclick="sendMessage()">Send</button>

    <script>
        const chat = document.getElementById('chat');
        const input = document.getElementById('messageInput');
        const status = document.getElementById('status');
        const socket = new WebSocket("ws://localhost:8080/ws");

        socket.onopen = () => {
            status.innerText = "Connected! Waiting for color change...";
            status.style.color = "green";
        };

        socket.onmessage = (e) => {
            const event = JSON.parse(e.data);

            // Handle Chat Messages
            if (event.name === "chat") {
                const msgDiv = document.createElement('div');
                msgDiv.className = 'message';
                msgDiv.innerText = "Chat: " + JSON.stringify(event.data);
                chat.appendChild(msgDiv);
                chat.scrollTop = chat.scrollHeight;
            }

            // Handle Background Color Changes
            if (event.name === "color-change") {
                console.log("Changing color to:", event.data);
                document.body.style.backgroundColor = event.data;
            }
        };

        function sendMessage() {
            if (input.value) {
                const event = { name: "chat", data: input.value };
                socket.send(JSON.stringify(event));
                input.value = "";
            }
        }
    </script>
</body>
</html>
